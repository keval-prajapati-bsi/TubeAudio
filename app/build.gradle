plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.vibesync.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.vibesync.app"
        minSdk 26
        targetSdk 34
        versionCode 33
        versionName "33.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion "1.5.14"
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }

    // Renamed from the old "app-debug.apk" default so the built file itself reads "VibeSync",
    // matching the app's new display name.
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "VibeSync-${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.4'
    implementation 'androidx.activity:activity-compose:1.9.1'

    implementation platform('androidx.compose:compose-bom:2024.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'
    implementation 'androidx.media3:media3-common:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'

    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    implementation 'io.coil-kt:coil-compose:2.6.0'
    // Real dominant-color extraction for Now Playing's per-track ambient background (was a static
    // blur before -- this is the actual Palette-API technique that backs it now).
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // NewPipeExtractor pulls its own protobuf-javalite:4.35.1, which forces Gradle to resolve
    // *every* protobuf-javalite reference in the project up to that version (Gradle picks the
    // highest requested version by default) -- including Firestore's transitive
    // protolite-well-known-types:18.0.0, which was actually compiled against protobuf-javalite
    // 3.14.0. That version mismatch is what caused
    // `NoClassDefFoundError: com.google.type.LatLng` at runtime on every Firestore write (found
    // via a real crash log): protolite-well-known-types' compiled classes don't line up with
    // 4.35.1's internal schema-registration mechanism. Excluded here so Firestore's own
    // dependency chain resolves to its own mutually-compatible protobuf-javalite version instead
    // of being forced upward by an unrelated library. NewPipeExtractor's own protobuf usage is
    // generic enough (GeneratedMessageLite parsing, no version-specific 4.35.1-only API) that it
    // still works fine on the older, resolved-down version.
    implementation('com.github.TeamNewPipe:NewPipeExtractor:v0.26.4') {
        exclude group: 'com.google.protobuf', module: 'protobuf-javalite'
    }

    // Party feature: Firebase Auth (email/password accounts) + Firestore (party rooms, queue,
    // live sync signal). The BoM pins all Firebase artifact versions together -- no version
    // number on the individual firebase-* lines below.
    // Pinned below the latest BoM (34.x) deliberately -- 34.x's artifacts are compiled with
    // Kotlin 2.3 metadata, incompatible with this project's Kotlin 1.9.24 toolchain (same kind of
    // conservative version pin as the Media3 1.4.1 one above, for the same reason: bumping the
    // whole Kotlin/Compose toolchain is a bigger, riskier change than pinning one dependency).
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    implementation 'com.google.firebase:firebase-firestore'

    // Firebase's Task<T> needs this to get a Kotlin coroutines .await() extension.
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
