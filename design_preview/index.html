<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VibeSync — UI Preview</title>
  <style>
    :root { --bg:#050505; --surface:#151515; --surface-2:#202020; --text:#fff; --muted:#aaa; --red:#ff1f38; --line:#2a2a2a; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; background:#111; color:var(--text); font:14px/1.35 Inter,Roboto,Arial,sans-serif; display:grid; place-items:center; }
    button { font:inherit; color:inherit; cursor:pointer; border:0; } .phone { width:390px; height:844px; overflow:hidden; position:relative; border:8px solid #252525; border-radius:36px; background:var(--bg); box-shadow:0 28px 80px #000; }
    .status { height:30px; padding:8px 22px 0; font-size:11px; display:flex; justify-content:space-between; } .screen { height:calc(100% - 30px); overflow:auto; padding:8px 16px 152px; scrollbar-width:none; } .screen::-webkit-scrollbar{display:none}
    .top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:5px 0 22px; } .brand { display:flex; align-items:center; gap:9px; font-weight:800; letter-spacing:-.4px; font-size:17px; } .logo { background:var(--red); width:28px; height:20px; border-radius:7px; display:grid; place-items:center; color:#fff; font-size:11px; } .icon { background:transparent; font-size:20px; padding:5px; }
    h1 { font-size:28px; margin:0 0 18px; letter-spacing:-1px; } h2 { font-size:19px; margin:28px 0 13px; letter-spacing:-.3px; } .chips { display:flex; gap:8px; overflow:auto; padding-bottom:3px; } .chip { white-space:nowrap; background:var(--surface-2); border-radius:9px; padding:8px 12px; } .chip.active { background:#fff; color:#111; font-weight:700; }
    .hero { height:200px; padding:20px; margin-top:18px; border-radius:18px; display:flex; flex-direction:column; justify-content:end; background:linear-gradient(125deg,#081727 0%,#146b6b 48%,#03343a 100%); overflow:hidden; position:relative; } .hero::after { content:'♫'; position:absolute; right:14px; top:-25px; font-size:220px; opacity:.18; } .eyebrow { color:#d7d7d7; font-size:12px; font-weight:700; } .hero strong { font-size:28px; letter-spacing:-1px; z-index:1; } .hero small { color:#e0e0e0; z-index:1; }
    .row { display:flex; gap:13px; overflow:auto; padding-bottom:4px; } .tile { min-width:132px; } .cover { height:132px; border-radius:13px; display:flex; align-items:end; padding:12px; font-size:25px; background:linear-gradient(135deg,#681b5b,#e81e63); box-shadow:inset 0 -60px 40px #0007; } .cover.b { background:linear-gradient(135deg,#e0b08f,#6c2d25); }.cover.c {background:linear-gradient(135deg,#6e4af5,#1e124d)}.cover.d{background:linear-gradient(135deg,#314c74,#090d19)} .tile b { display:block; margin-top:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .tile span,.sub { color:var(--muted); font-size:12px; }
    .list { display:grid; gap:4px; } .song { display:flex; align-items:center; gap:12px; padding:9px 3px; } .thumb { width:47px; height:47px; border-radius:6px; background:linear-gradient(135deg,#8c5c48,#2b1310); display:grid; place-items:center; font-size:19px; flex:0 0 auto; }.song-info{min-width:0; flex:1}.song b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.song span{color:var(--muted);font-size:12px}.more{color:var(--muted);font-size:20px}
    .search { background:var(--surface-2); padding:12px 14px; border-radius:8px; color:var(--muted); margin:3px 0 17px; }.genre-grid {display:grid;grid-template-columns:1fr 1fr;gap:11px}.genre{height:94px;border-radius:12px;padding:14px;font-weight:800;font-size:18px;display:flex;align-items:end;background:linear-gradient(135deg,#9b1c4d,#401021)}.genre:nth-child(2){background:linear-gradient(135deg,#644bb9,#241741)}.genre:nth-child(3){background:linear-gradient(135deg,#a05b18,#48220a)}.genre:nth-child(4){background:linear-gradient(135deg,#126565,#072e31)}
    .library-hero{height:178px;border-radius:16px;background:linear-gradient(145deg,#77173e,#220b19);padding:17px;display:flex;align-items:end;font-size:27px;font-weight:800}.playlist{display:flex;align-items:center;gap:12px;padding:11px 0}.playlist .thumb{width:58px;height:58px;border-radius:8px;background:#60443b}.profile{display:grid;place-items:center;text-align:center;padding:18px 0}.avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#f01f59,#6f3fff);display:grid;place-items:center;font-size:30px;font-weight:800}.settings{border-top:1px solid var(--line);margin-top:12px}.setting{padding:16px 2px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.setting span{color:var(--muted)}
    .mini { position:absolute; left:10px; right:10px; bottom:68px; height:62px; background:#292929; border-radius:8px; display:flex; align-items:center; gap:10px; padding:7px; box-shadow:0 8px 28px #0008; }.mini .thumb{height:48px;width:48px}.mini b{font-size:13px}.mini span{font-size:11px;color:var(--muted)}.play{margin-left:auto;background:#fff;color:#111;border-radius:50%;width:35px;height:35px;font-size:15px}.nav { position:absolute; bottom:0; left:0; right:0; height:72px; background:#0b0b0b; border-top:1px solid #171717; display:flex; justify-content:space-around; }.nav button { flex:1; background:transparent; color:var(--muted); font-size:11px; padding:9px 0 7px; }.nav button i{display:block;font-style:normal;font-size:21px;margin-bottom:2px}.nav button.active{color:#fff}.nav button.active i{color:var(--red)}
    .now { min-height:100%; display:flex; flex-direction:column; }.now-top{display:flex;justify-content:space-between;margin:5px 0 35px}.album{width:100%;aspect-ratio:1;border-radius:17px;background:linear-gradient(135deg,#6d4a94,#1e1538 46%,#e1a26f);box-shadow:0 22px 60px #4c257855;display:grid;place-items:center;font-size:90px}.track-title{font-size:24px;font-weight:800;margin:28px 0 2px}.progress{height:3px;background:#5a5a5a;border-radius:5px;margin-top:30px}.progress div{width:38%;height:100%;background:#fff;border-radius:5px}.time{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:7px}.controls{display:flex;justify-content:space-around;align-items:center;margin-top:27px;font-size:30px}.controls .main{width:62px;height:62px;border-radius:50%;background:#fff;color:#000;font-size:25px}
    @media (max-width:430px){body{display:block;background:var(--bg)}.phone{width:100vw;height:100vh;border:0;border-radius:0}}
  </style>
</head>
<body>
  <main class="phone">
    <div class="status"><span>9:41</span><span>◔ ◡ ▰</span></div>
    <section class="screen" id="app"></section>
    <div class="mini" id="mini"><div class="thumb">♫</div><div><b>Late Night Drive</b><br><span>VibeSync Mix</span></div><button class="play" onclick="show('now')">▶</button></div>
    <nav class="nav"><button data-page="home" class="active" onclick="show('home')"><i>⌂</i>Home</button><button data-page="explore" onclick="show('explore')"><i>◉</i>Explore</button><button data-page="library" onclick="show('library')"><i>▤</i>Library</button><button data-page="profile" onclick="show('profile')"><i>◯</i>Profile</button></nav>
  </main>
  <script>
    const songs = [['Midnight Echoes','Rhea x The City','♫'],['Golden Hour','Arjun Vale','☀'],['Slow Motion','Kira Lane','◌'],['Afterglow','Lunar Club','✦']];
    const songRows = songs.map(([t,a,x])=>`<div class="song"><div class="thumb">${x}</div><div class="song-info"><b>${t}</b><span>${a} · Song</span></div><button class="more">⋮</button></div>`).join('');
    const pages = {
      home: `<div class="top"><div class="brand"><span class="logo">▶</span>VibeSync</div><div><button class="icon">⌕</button><button class="icon" onclick="show('profile')">◯</button></div></div><h1>Good evening</h1><div class="chips"><button class="chip active">All</button><button class="chip">Relax</button><button class="chip">Energise</button><button class="chip">Workout</button></div><div class="hero"><span class="eyebrow">MADE FOR YOU</span><strong>Night Drive Mix</strong><small>Atmospheric electronic for the road</small></div><h2>Quick picks</h2><div class="list">${songRows}</div><h2>Made for you</h2><div class="row"><div class="tile"><div class="cover">♫</div><b>Late Night Drive</b><span>VibeSync Mix</span></div><div class="tile"><div class="cover b">☀</div><b>Morning Boost</b><span>Feel good pop</span></div><div class="tile"><div class="cover c">◌</div><b>Focus Flow</b><span>Instrumental</span></div></div>`,
      explore: `<div class="top"><div class="brand"><span class="logo">▶</span>Explore</div><button class="icon" onclick="show('profile')">◯</button></div><div class="search">⌕ &nbsp; Search songs, artists, albums</div><h2>Start radio from a mood</h2><div class="chips"><button class="chip active">Trending</button><button class="chip">New releases</button><button class="chip">Charts</button></div><h2>Browse all</h2><div class="genre-grid"><div class="genre">Workout</div><div class="genre">Chill</div><div class="genre">Bollywood</div><div class="genre">Focus</div></div><h2>Popular right now</h2><div class="list">${songRows}</div>`,
      library: `<div class="top"><div class="brand">Library</div><button class="icon">⌕</button></div><div class="chips"><button class="chip active">Playlists</button><button class="chip">Songs</button><button class="chip">Albums</button></div><div class="library-hero">♥<br>Liked Music</div><h2>Your playlists</h2><div class="playlist"><div class="thumb">♫</div><div><b>Late Night Drive</b><br><span class="sub">Playlist · 28 songs</span></div></div><div class="playlist"><div class="thumb">☀</div><div><b>Daily Mix</b><br><span class="sub">Playlist · 42 songs</span></div></div><div class="playlist"><div class="thumb">◌</div><div><b>Focus Mode</b><br><span class="sub">Playlist · 19 songs</span></div></div>`,
      profile: `<div class="top"><button class="icon">‹</button><b>Account</b><button class="icon">⋮</button></div><div class="profile"><div class="avatar">K</div><h2 style="margin:13px 0 2px">Kamal</h2><span class="sub">kamal@vibesync.app</span></div><div class="settings"><div class="setting">Your channel <span>›</span></div><div class="setting">Downloads <span>›</span></div><div class="setting">Appearance <span>Dark ›</span></div><div class="setting">Playback & downloads <span>›</span></div><div class="setting">Notifications <span>›</span></div><div class="setting">Settings <span>›</span></div></div>`,
      now: `<div class="now"><div class="now-top"><button class="icon" onclick="show('home')">⌄</button><span class="eyebrow">NOW PLAYING</span><button class="icon">⋮</button></div><div class="album">♫</div><div class="track-title">Late Night Drive</div><span class="sub">VibeSync Mix</span><div class="progress"><div></div></div><div class="time"><span>1:24</span><span>3:46</span></div><div class="controls"><button class="icon">↻</button><button class="icon">|◀</button><button class="main">▶</button><button class="icon">▶|</button><button class="icon">≋</button></div></div>`
    };
    function show(page){ document.getElementById('app').innerHTML=pages[page]; document.getElementById('mini').style.display=page==='now'?'none':'flex'; document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page)); }
    show('home');
  </script>
</body>
</html>
